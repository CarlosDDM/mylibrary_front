<div class="px-4 pt-3">
  <input pInputText placeholder="Buscar..." [value]="filterText()" (input)="onFilter($event)" />
</div>
<app-bookshelf
  [resource]="pageResource()"
  [typeCard]="typeCard()"
  (cardClick)="cardClick.emit($event)"
  [skeletonCount]="6"
  (retry)="retry.emit()"
/>
<p-paginator
  [totalRecords]="total()"
  [rows]="pageSize()"
  [first]="skip()"
  (onPageChange)="onPageChange($event)"
/>
