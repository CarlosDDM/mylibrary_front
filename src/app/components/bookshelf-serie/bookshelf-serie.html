<section class="px-4 md:px-8">
  <div class="grid grid-cols-[repeat(auto-fill,minmax(240px,1fr))] gap-3 mt-4">
    @switch (resource().state) {
      @case (loadStateEnum.Loading) {
        @for (i of skeletonItems(); track i) {
          <app-serie-skeleton />
        }
      }
      @case (loadStateEnum.Error) {
        <app-error-state class="col-span-full" componentName="Séries" [errors]="resource().error" />
      }
      @case (loadStateEnum.Empty) {
        <app-empty-state class="col-span-full" />
      }
      @case (loadStateEnum.Success) {
        @for (serieData of resource().data; track serieData.id) {
          <app-serie-card [serie]="serieData" (handleClick)="cardClick.emit($event)" />
        }
      }
    }
  </div>
</section>
