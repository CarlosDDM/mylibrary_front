<div class="w-full">
  <button
    [title]="normalized()?.name"
    class="flex items-center gap-2 w-full text-left cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-zinc-400/30 rounded-md px-2 py-1.5 hover:bg-zinc-200 dark:hover:bg-white/5 transition-colors duration-150"
    (click)="handleClick.emit(normalized()?.id!)"
    (keydown.enter)="handleClick.emit(normalized()?.id!)"
    (keydown.space)="handleClick.emit(normalized()?.id!)"
  >
    <div
      [class]="
        'shrink-0 w-20 h-26 rounded flex items-center justify-center overflow-hidden ' +
        coverColor().bg
      "
    >
      <i
        [class]="'pi ' + coverIcon() + ' ' + coverColor().icon"
        [style]="{ 'font-size': '1.2rem' }"
      ></i>
    </div>

    <div class="flex-1 min-w-0 flex flex-col gap-1">
      <span class="text-sm font-medium text-zinc-800 dark:text-zinc-100 truncate">
        {{ normalized()?.name }}
      </span>

      <div class="flex items-center gap-1">
        @switch (cardType()) {
          @case ('series') {
            <span class="text-xs text-zinc-500 dark:text-zinc-400 whitespace-nowrap">
              <strong class="text-zinc-700 dark:text-zinc-200">{{
                normalized()?.serieVolumes
              }}</strong>
              vol.
            </span>
            <span class="text-zinc-400 dark:text-zinc-600 text-xs">·</span>
            <span [class]="volumesClass()">
              {{ normalized()?.works?.length ?? 0 }} / {{ normalized()?.serieVolumes }} vol.
            </span>
          }
          @case ('franchises') {
            <span class="text-xs text-zinc-500 dark:text-zinc-400">
              <strong class="text-zinc-700 dark:text-zinc-200">{{
                normalized()?.series?.length ?? 0
              }}</strong>
              séries
            </span>
          }
          @case ('works') {
            <span class="text-xs text-zinc-500 dark:text-zinc-400">
              Vol.
              <strong class="text-zinc-700 dark:text-zinc-200">{{ normalized()?.volume }}</strong>
            </span>
          }
        }
      </div>

      @if (normalized()?.status) {
        <app-chip
          size="sm"
          class="w-fit mt-0.5"
          [variant]="statusVariantMap[normalized()!.status!.type]"
          [label]="normalized()?.status?.type | translatePipe: statusDictionary"
        />
      }
    </div>

    <i class="pi pi-angle-right text-zinc-400 dark:text-zinc-600 text-sm shrink-0"></i>
  </button>
</div>
