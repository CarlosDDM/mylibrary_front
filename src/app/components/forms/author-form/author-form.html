<form
  class="flex flex-col px-4 py-2 gap-6 items-center"
  [formGroup]="formAuthor"
  (ngSubmit)="onSubmit()"
>
  <app-form-input class="w-full" id="name" label="Nome do autor" formControlName="name" />
  <app-form-button
    type="submit"
    label="Salvar autor"
    size="large"
    [disabled]="formAuthor.invalid"
  />
</form>
