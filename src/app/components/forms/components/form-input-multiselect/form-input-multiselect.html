<div>
  <p-floatlabel variant="on">
    <p-multiselect
      [id]="id()"
      [options]="options()"
      [optionLabel]="optionLabel()"
      [optionValue]="optionValue()"
      [invalid]="invalid()"
      [loading]="loading()"
      [disabled]="isDisabled()"
      [ngModel]="value()"
      (onBlur)="onTouched()"
      (ngModelChange)="onValueChange($event)"
      fluid
      filter
      display="chip"
      appendTo="body"
    >
      @if (buttonLabel()) {
        <ng-template #footer>
          <div class="p-3">
            <p-button
              [label]="buttonLabel()"
              fluid
              severity="secondary"
              text
              size="small"
              icon="pi pi-plus"
              (click)="handleOnclick.emit()"
            />
          </div>
        </ng-template>
      }
    </p-multiselect>
    <label [for]="id()">{{ label() }}</label>
  </p-floatlabel>
</div>
