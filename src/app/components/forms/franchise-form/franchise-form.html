<form class="flex flex-col p-2 gap-6" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-form-input id="name" label="Nome" formControlName="name" />
  <app-form-button
    type="submit"
    label="Salvar"
    [disabled]="form.invalid || form.disabled || isSubmitting()"
    size="large"
  />
</form>
