<form class="flex flex-col px-4 py-2 gap-6 items-center" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-form-input class="w-full" id="name" label="Nome do ilustrador" formControlName="name" />
  <app-form-button
    type="submit"
    [disabled]="form.invalid || form.disabled"
    label="Salvar"
    size="large"
  />
</form>
