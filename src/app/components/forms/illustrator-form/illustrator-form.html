<form
  class="flex flex-col px-4 py-2 gap-6 items-center"
  [formGroup]="formIllustrator"
  (ngSubmit)="onSubmit()"
>
  <app-form-input class="w-full" id="name" label="Nome do ilustrador" formControlName="name" />
  <p-button type="submit" [disabled]="formIllustrator.invalid">Salvar ilustrador</p-button>
</form>
