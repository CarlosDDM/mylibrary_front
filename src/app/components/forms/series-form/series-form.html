<form [formGroup]="form" class="flex flex-col gap-6 px-2 py-4 w-full" (ngSubmit)="onSubmit()">
  <app-form-input id="name" label="Nome da série" formControlName="name" />

  <app-form-input-file-upload
    formControlName="coverFile"
    label="Capa da série"
    [currentUrl]="currentCoverUrl()"
    accept="image/*"
    (removed)="coverRemoved.set($event)"
  />

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">
    <app-form-input-select
      formControlName="statusId"
      id="statusId"
      label="Status"
      [options]="status().data"
      optionValue="id"
      optionLabel="type"
      [loading]="status().state === loadState.Loading"
      [translateKey]="serieTranslation"
    />

    <div class="flex flex-col gap-2">
      <app-form-input-counter
        formControlName="serieVolumes"
        id="serieVolumes"
        label="Qtd. volumes"
        [min]="1"
      />
      <app-form-input-checkbox
        class="text-sm/tight text-muted-color"
        id="noVolumes"
        label="Sem volumes"
        [formControl]="noVolumesControl"
      />
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <app-form-input-select
      id="franchiseId"
      label="Franquia"
      formControlName="franchiseId"
      [options]="franchiseLoader.options()"
      optionLabel="name"
      optionValue="id"
      [loading]="franchiseLoader.loading()"
      [lazy]="true"
      (filterChange)="franchiseLoader.search($event)"
      (loadMore)="franchiseLoader.loadMore()"
      buttonLabel="Criar nova franquia"
      (handleOnclick)="franchiseModal()"
    />
    <app-form-input-checkbox
      class="text-sm/tight text-muted-color"
      id="noFranchise"
      label="Sem franquia"
      [formControl]="noFranchiseControl"
    />
  </div>

  <div class="flex justify-end gap-4 w-full mt-1">
    <app-form-button label="Cancelar" severity="danger" size="large" (handleClick)="handleClick()" />
    <app-form-button
      type="submit"
      label="Salvar"
      [disabled]="form.invalid || form.disabled || isSubmitting()"
      size="large"
    />
  </div>
</form>
