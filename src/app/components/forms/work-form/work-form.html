<form class="grid grid-cols-2 gap-4 py-6 px-2" [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-form-input-select
    class="col-span-2"
    id="serieId"
    label="Série"
    formControlName="serieId"
    [options]="seriesLoader.options()"
    optionLabel="name"
    optionValue="id"
    [loading]="seriesLoader.loading()"
    [lazy]="true"
    (filterChange)="seriesLoader.search($event)"
    (loadMore)="seriesLoader.loadMore()"
    buttonLabel="Criar nova série"
    (handleOnclick)="seriesModal()"
  />

  <app-form-input
    class="col-span-2"
    id="name"
    label="Nome da obra"
    [invalid]="isInvalid('name')"
    formControlName="name"
  />
  <app-form-input class="col-span-2" id="subtitle" label="Sub-título" formControlName="subtitle" />

  <div class="col-span-2 flex flex-col gap-4">
    <app-form-input-number
      id="price"
      label="Preço"
      formControlName="price"
      mode="currency"
      currency="BRL"
      [min]="0"
    />
    <div class="flex items-start justify-between flex-wrap gap-x-2 gap-y-3">
      <div class="flex flex-col gap-2">
        <app-form-input-counter id="volume" label="Volume" [min]="0" formControlName="volume" />
        <app-form-input-checkbox
          class="text-sm/tight text-muted-color"
          id="noVolume"
          label="Sem volume"
          [formControl]="noVolumeControl"
        />
      </div>
      <app-form-input-checkbox
        id="isSpecialEdition"
        label="Edição especial"
        formControlName="isSpecialEdition"
      />
    </div>
  </div>

  @if (isSpecial()) {
    <app-form-input
      class="col-span-2"
      label="Nome do volume"
      id="volumeName"
      formControlName="volumeName"
    />
  }

  <app-form-input-select
    id="languageId"
    label="Idioma"
    formControlName="languageId"
    [options]="languages().data"
    optionLabel="type"
    optionValue="id"
    [invalid]="isInvalid('languageId')"
    [loading]="languages().state === loadState.Loading"
  />

  <app-form-input-select
    id="mediaId"
    label="Mídia"
    formControlName="mediaId"
    [options]="medias().data"
    optionLabel="type"
    optionValue="id"
    [translateKey]="workMediaTranslation"
    [invalid]="isInvalid('mediaId')"
    [loading]="medias().state === loadState.Loading"
  />

  <app-form-input-multiselect
    class="col-span-2 sm:col-span-1"
    id="authors"
    label="Autores"
    formControlName="authors"
    [options]="authorsLoader.options()"
    optionLabel="name"
    optionValue="id"
    [loading]="authorsLoader.loading()"
    [lazy]="true"
    (filterChange)="authorsLoader.search($event)"
    (loadMore)="authorsLoader.loadMore()"
    [invalid]="isInvalid('authors')"
    buttonLabel="Criar novo autor"
    (handleOnclick)="authorModal()"
  />

  <app-form-input-multiselect
    class="col-span-2 sm:col-span-1"
    id="illustrators"
    label="Ilustradores"
    formControlName="illustrators"
    [options]="illustratorsLoader.options()"
    optionLabel="name"
    optionValue="id"
    [loading]="illustratorsLoader.loading()"
    [lazy]="true"
    (filterChange)="illustratorsLoader.search($event)"
    (loadMore)="illustratorsLoader.loadMore()"
    buttonLabel="Criar novo ilustrador"
    (handleOnclick)="illustratorModal()"
  />

  <app-form-input-cover-gallery
    class="col-span-2"
    label="Capas"
    formControlName="covers"
    [covers]="currentCovers()"
    (coverRemoved)="onCoverRemoved($event)"
  />

  <div class="col-span-2 flex justify-end gap-4 w-full">
    <app-form-button label="Cancelar" severity="danger" size="large" (handleClick)="handleClick()" />
    <app-form-button
      type="submit"
      [disabled]="form.invalid || form.disabled || isSubmitting()"
      label="Salvar"
      size="large"
    />
  </div>
</form>
