<header
  class="flex items-center gap-4 h-16 px-8 bg-zinc-100 dark:bg-zinc-900 border-b border-zinc-200 dark:border-zinc-800"
>
  <!-- mobile: hambúrguer + logo -->
  <div class="flex items-center gap-4 lg:hidden">
    <button
      (click)="drawerService.openNav()"
      class="hover:opacity-70 transition-opacity cursor-pointer"
    >
      <i class="pi pi-bars text-zinc-700 dark:text-zinc-100 text-xl"></i>
    </button>
    <a
      routerLink="/"
      class="text-xl font-semibold text-zinc-700 dark:text-zinc-100 hover:opacity-70 transition-opacity"
    >
      My Library
    </a>
  </div>

  <!-- desktop: logo só quando a sidebar está recolhida -->
  @if (drawerService.collapsed()) {
    <a
      routerLink="/"
      class="hidden lg:block text-xl font-semibold text-zinc-700 dark:text-zinc-100 hover:opacity-70 transition-opacity"
    >
      My Library
    </a>
  }

  <button
    (click)="searchOpen.set(true)"
    class="ml-auto flex items-center gap-2 px-3 py-1.5 rounded-md cursor-pointer border border-zinc-300 dark:border-zinc-700 text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:border-zinc-400 dark:hover:border-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 shadow-sm dark:shadow-none transition-all"
  >
    <i class="pi pi-search text-sm"></i>
    <span class="hidden md:inline text-sm">Buscar...</span>
    <span
      class="hidden md:inline text-xs leading-none text-zinc-500 dark:text-zinc-400 border border-zinc-400 dark:border-zinc-600 rounded px-1.5 py-0.5"
      >Ctrl+K</span
    >
  </button>
</header>

<p-dialog
  [(visible)]="searchOpen"
  [showHeader]="false"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  position="top"
  styleClass="w-full max-w-lg mt-16"
>
  <div class="px-1 py-6">
    <p-iconfield class="w-full">
      <p-inputicon class="pi pi-search" />
      <input
        type="text"
        pInputText
        placeholder="Buscar séries, franquias, obras..."
        class="w-full text-sm"
        [ngModel]="search()"
        (ngModelChange)="search.set($event)"
      />
      @if (search()) {
        <p-inputicon
          class="pi pi-times cursor-pointer"
          style="right: 0.5rem"
          (click)="search.set('')"
        />
      }
    </p-iconfield>
    <p class="text-xs text-zinc-600 mt-3 px-1">Digite para buscar...</p>
  </div>
</p-dialog>
