<div>
  @switch (typeCard) {
    @case ('serie') {
      <div class="border-b border-zinc-700 p-5 pb-4">
        <div class="flex items-start justify-between gap-3 mb-3">
          <div>
            <h2 class="text-base font-medium text-zinc-100 leading-tight mb-1">
              {{ profileTitle() }}
            </h2>
            <p class="text-sm text-zinc-400 flex items-center gap-1">
              <i class="pi pi-star text-xs"></i>
              {{ franchiseName() }}
            </p>
          </div>
          <span
            class="text-[11px] font-medium px-2 py-0.5 rounded-full border shrink-0"
            [class]="statusClass()"
          >
            {{ serieStatus() | translatePipe: statusDictionary }}
          </span>
        </div>

        <div class="flex gap-2">
          <div class="flex-1 bg-zinc-800 rounded-lg p-3">
            <p class="text-[11px] text-zinc-400 mb-1">Volumes coletados</p>
            <p class="text-lg font-medium text-zinc-100">
              {{ serieWorks().length }}
              <span class="text-sm font-normal text-zinc-400">/ {{ serieVolumes() }}</span>
            </p>
            <div class="mt-1.5 h-0.5 bg-zinc-700 rounded-full overflow-hidden">
              <div
                class="h-full bg-blue-500 rounded-full"
                [style.width.%]="serieProgressWidth()"
              ></div>
            </div>
          </div>
          <div class="flex-1 bg-zinc-800 rounded-lg p-3">
            <p class="text-[11px] text-zinc-400 mb-1">Volumes totais</p>
            <p class="text-lg font-medium text-zinc-100">{{ serieVolumes() }}</p>
          </div>
        </div>
      </div>

      <app-bookshelf [typeCard]="'work'" [data]="serieWorks()" [showButtons]="showButtons" />
    }

    @case ('franchise') {
      <app-bookshelf
        [typeCard]="'serie'"
        [titleSection]="profileTitle()"
        [data]="franchiseSeries()"
        [showButtons]="showButtons"
      />
    }

    @case ('work') {
      <!-- componente de work -->
    }
  }
</div>
