<div class="flex items-center justify-between gap-4 mb-4 px-8">
  <h2 class="flex items-center gap-3 text-xl/tight font-semibold tracking-tight text-color">
    <span class="inline-block h-6 w-1 rounded-full bg-primary" aria-hidden="true"></span>
    {{ titleSection() }}
  </h2>

  @if (showButtons()) {
    <a
      [routerLink]="path()"
      class="group inline-flex items-center gap-1 text-sm font-medium text-primary transition-colors hover:text-primary-emphasis"
    >
      {{ buttonName() }}
      <i class="pi pi-arrow-right text-xs transition-transform group-hover:translate-x-0.5"></i>
    </a>
  }
</div>
