<div class="flex items-center justify-between mb-3 px-8">
  <h2 class="text-xl/tight font-medium">{{ titleSection() }}</h2>
  @if (showButtons()) {
    <a [routerLink]="path()" pButton class="text-sm font-medium text-blue-500 hover:text-blue-700">
      <span pButtonLabel>{{ buttonName() }}</span>
    </a>
  }
</div>
