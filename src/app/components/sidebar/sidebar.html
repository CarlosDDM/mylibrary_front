<aside
  class="hidden lg:flex flex-col shrink-0 bg-zinc-100 dark:bg-zinc-900 transition-[width] duration-200"
  [class]="drawerService.collapsed() ? 'w-16' : 'w-64'"
>
  <!-- topo: logo + botão de recolher -->
  <div
    class="flex items-center h-16 border-b border-zinc-200 dark:border-zinc-800"
    [class]="drawerService.collapsed() ? 'justify-center' : 'px-3'"
  >
    @if (!drawerService.collapsed()) {
      <a
        routerLink="/"
        class="flex-1 px-3 truncate text-xl font-semibold text-zinc-700 dark:text-zinc-100 hover:opacity-70 transition-opacity"
      >
        My Library
      </a>
    }
    <button
      (click)="drawerService.toggleCollapse()"
      class="p-2 rounded-lg cursor-pointer text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/60 transition-colors"
    >
      <i
        class="pi {{
          drawerService.collapsed() ? 'pi-angle-double-right' : 'pi-angle-double-left'
        }}"
      ></i>
    </button>
  </div>
  <nav class="flex-1 overflow-y-auto flex flex-col gap-1 p-3">
    @for (item of navItems; track item.routerLink) {
      <a
        [routerLink]="item.routerLink"
        routerLinkActive="bg-zinc-200 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold"
        [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
        [pTooltip]="drawerService.collapsed() ? item.label : undefined"
        tooltipPosition="right"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/60 transition-colors"
        [class.justify-center]="drawerService.collapsed()"
      >
        <i class="text-base {{ item.icon }}"></i>
        @if (!drawerService.collapsed()) {
          <span class="text-sm font-medium">{{ item.label }}</span>
        }
      </a>
    }
  </nav>
</aside>

<p-drawer [(visible)]="drawerService.nav" position="left">
  <ng-template #header>
    <a routerLink="/" (click)="drawerService.closeNav()">
      <span class="text-xl font-semibold text-zinc-700 dark:text-zinc-100">My Library</span>
    </a>
  </ng-template>
  <hr class="border-zinc-700 mb-4" />
  <nav class="flex-1 overflow-y-auto flex flex-col gap-1 p-3">
    @for (item of navItems; track item.routerLink) {
      <a
        [routerLink]="item.routerLink"
        (click)="drawerService.closeNav()"
        routerLinkActive="bg-zinc-200 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 font-semibold"
        [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
        [pTooltip]="drawerService.collapsed() ? item.label : undefined"
        tooltipPosition="right"
        class="flex items-center gap-3 px-3 py-2 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-200/60 dark:hover:bg-zinc-800/60 transition-colors"
      >
        <i class="text-base {{ item.icon }}"></i>
        <span class="text-sm font-medium">
          {{ item.label }}
        </span>
      </a>
    }
  </nav>
</p-drawer>
