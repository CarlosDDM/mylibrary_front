<div class="select-none h-full" title="{{ stat().name }}: {{ stat().value }}">
  <p-card [pt]="ptCard">
    <p
      class="text-center font-bold m-0 tracking-tight tabular-nums leading-none {{ valueClass() }}"
    >
      @if (stat().format === 'currency') {
        {{ stat().value | currency: 'BRL' : 'symbol' : '1.0-2' }}
      } @else {
        {{ stat().value }}
      }
    </p>
    <p
      class="text-center text-xs md:text-sm text-slate-400 m-0 mt-3 font-medium uppercase tracking-wider"
    >
      {{ stat().name }}
    </p>
  </p-card>
</div>
