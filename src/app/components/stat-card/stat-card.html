<div class="select-none" [title]="label()">
  <p-card
    [pt]="{
      root: { class: 'w-full md:w-60 rounded-lg' },
      body: { class: 'px-4! py-6! rounded! dark:bg-zinc-800! dark:border-zinc-700!' },
    }"
  >
    <div class="flex flex-col items-center justify-center">
      <p class="text-center text-7xl">
        <strong>{{ qtd() }}</strong>
      </p>
      <p class="text-center text-sm text-slate-400 dark:text-slate-300">{{ label() }}</p>
    </div>
  </p-card>
</div>
