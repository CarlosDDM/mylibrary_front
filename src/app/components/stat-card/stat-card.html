<div class="select-none h-full" title="{{ stat().name }}: {{ stat().value }}">
  <p-card
    [pt]="{
      root: { class: 'w-full md:w-60 h-36 justify-center' },
      body: {
        class: 'px-4! py-6! !h-full rounded! dark:bg-zinc-800! dark:border-zinc-700!',
      },
    }"
  >
    <div class="flex flex-col items-center justify-center h-full">
      <p
        [class]="
          (stat().value?.toString()?.length ?? 0) > 4
            ? 'text-center text-4xl'
            : 'text-center text-7xl'
        "
      >
        <strong>
          @if (stat().format === 'currency') {
            {{ stat().value | currency: 'BRL' : 'symbol' : '1.0-2' }}
          } @else {
            {{ stat().value }}
          }
        </strong>
      </p>
      <p class="text-center text-sm text-slate-400 dark:text-slate-300">{{ stat().name }}</p>
    </div>
  </p-card>
</div>
