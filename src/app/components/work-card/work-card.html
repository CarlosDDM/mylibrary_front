<div class="w-full">
  <button
    [title]="work().name + (work().volume !== null ? ' - Vol. ' + work().volume : '')"
    class="flex items-center gap-2 w-full text-left cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-zinc-400/30 rounded-md px-2 py-1.5 hover:bg-zinc-200 dark:hover:bg-white/5 transition-colors duration-150"
    (click)="handleClick.emit(work().id)"
    (keydown.enter)="handleClick.emit(work().id)"
    (keydown.space)="handleClick.emit(work().id)"
  >
    <div
      [class]="
        'shrink-0 w-20 h-26 rounded flex items-center justify-center overflow-hidden ' +
        coverColor().bg
      "
    >
      <i [class]="'pi pi-bookmark ' + coverColor().icon" style="font-size: 1.2rem"></i>
    </div>
    <div class="flex-1 min-w-0 flex flex-col gap-1">
      <span class="text-sm font-medium text-zinc-800 dark:text-zinc-100 truncate">
        {{ work().name }}
      </span>
      @if (work().volume !== null || work().volumeName || work().subtitle) {
        <div class="flex items-center gap-1">
          @if (work().volume !== null) {
            <span class="text-xs text-zinc-500 dark:text-zinc-400 whitespace-nowrap">
              Vol. <strong class="text-zinc-700 dark:text-zinc-200">{{ work().volume }}</strong>
            </span>
          }
          @if (work().volumeName) {
            @if (work().volume !== null) {
              <span class="text-zinc-400 dark:text-zinc-600 text-xs">·</span>
            }
            <span class="text-xs text-zinc-500 dark:text-zinc-400 truncate">{{
              work().volumeName
            }}</span>
          }
          @if (work().subtitle) {
            @if (work().volume !== null || work().volumeName) {
              <span class="text-zinc-400 dark:text-zinc-600 text-xs">·</span>
            }
            <span class="text-xs text-zinc-500 dark:text-zinc-400 truncate">{{
              work().subtitle
            }}</span>
          }
        </div>
      }
    </div>
    <i class="pi pi-angle-right text-zinc-400 dark:text-zinc-600 text-sm shrink-0"></i>
  </button>
</div>
