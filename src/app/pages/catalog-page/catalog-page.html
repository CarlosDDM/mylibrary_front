<div class="flex-1 h-full w-full flex flex-col">
  <h1
    class="text-3xl md:text-4xl font-bold text-zinc-700 dark:text-zinc-100 text-center py-4 tracking-tight"
  >
    {{ title() }}
  </h1>

  <div class="max-w-300 mx-auto flex-1 w-full flex flex-col">
    <app-library
      [typeCard]="type"
      [resource]="resource()"
      [pageSize]="params().take!"
      (retry)="loadAll()"
      (cardClick)="handleCardClick($event)"
      (pageChange)="onPageChange($event)"
    />
  </div>
</div>
