<div>
  <h1
    class="text-3xl md:text-4xl font-bold text-zinc-700 dark:text-zinc-100 text-center py-4 tracking-tight"
  >
    {{ title() }}
  </h1>
  <div class="max-w-300 mx-auto">
    <app-bookshelf
      [typeCard]="type"
      [resource]="data()"
      [skeletonCount]="10"
      (cardClick)="handleCardClick($event)"
      [showButtons]="false"
      (retry)="loadAll()"
    />
  </div>
</div>
