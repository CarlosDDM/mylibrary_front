<div class="flex-1 flex flex-col gap-4">
  @if (typeCard() === 'works') {
    <app-bookshelf-work
      class="flex-1"
      [resource]="worksResource()"
      [skeletonCount]="8"
      (cardClick)="cardClick.emit($event)"
      (retry)="retry.emit()"
    />
  }
  @if (typeCard() === 'series') {
    <app-bookshelf-serie
      class="flex-1"
      [resource]="seriesResource()"
      (cardClick)="cardClick.emit($event)"
      (retry)="retry.emit()"
    />
  }

  <div
    class="mt-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 border-t border-surface px-4 py-3"
  >
    <span class="text-sm text-muted-color">
      <strong class="text-color font-medium">{{ pagination().total }}</strong>
      {{ getTypeItem(typeCard()) }} no total
    </span>

    @if (pagination().total > pageSize()) {
      <p-paginator
        [first]="skip()"
        [totalRecords]="pagination().total"
        [rows]="pageSize()"
        [pageLinkSize]="3"
        (onPageChange)="onPageChange($event)"
        template="PrevPageLink PageLinks NextPageLink"
        [pt]="paginatorPt"
      />
    }
  </div>
</div>
