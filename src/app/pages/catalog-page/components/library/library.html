<div class="flex-1 flex flex-col gap-4">
  <app-bookshelf
    class="flex-1"
    [typeCard]="typeCard()"
    [resource]="resource()"
    [skeletonCount]="10"
    (cardClick)="cardClick.emit($event)"
    [showButtons]="false"
    (retry)="retry.emit()"
  />

  <div class="mt-auto">
    <p-paginator
      [first]="skip()"
      [totalRecords]="totalRecords()"
      [rows]="pageSize()"
      (onPageChange)="onPageChange($event)"
    />
  </div>
</div>
