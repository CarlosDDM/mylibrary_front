<app-section-header
  [titleSection]="title()"
  [showButtons]="true"
  buttonName="Veja todos"
  [path]="'/' + typeCard()"
/>
@if (typeCard() === 'works') {
  <app-bookshelf-work
    [resource]="workResource()"
    (retry)="retry.emit($event)"
    (cardClick)="clickCard.emit($event)"
  />
}
@if (typeCard() === 'series') {
  <app-bookshelf-serie
    [resource]="serieResource()"
    (retry)="retry.emit($event)"
    (cardClick)="clickCard.emit($event)"
  />
}
