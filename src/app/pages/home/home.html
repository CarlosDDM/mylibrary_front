<div class="mt-4 mb-16 flex flex-col justify-center md:items-center">
  <app-wrapper-stats class="block w-full" [stats]="dashboardStats()" />
  <div class="flex flex-col gap-12 mt-8 justify-center w-full max-w-7xl">
    <app-home-section
      title="Séries"
      typeCard="series"
      [resource]="serieData()"
      (retry)="loadAll()"
      (clickCard)="handleClickSerie($event)"
    />
    <app-home-section
      title="Obras"
      typeCard="works"
      [resource]="workData()"
      (clickCard)="handleClickWork($event)"
      (retry)="loadAll()"
    />
  </div>
</div>
