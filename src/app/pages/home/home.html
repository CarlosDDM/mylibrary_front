<div class="mt-4 mb-16 flex flex-col justify-center md:items-center">
  <app-wrapper-stats [stats]="dashboardStats()" />
  <div class="flex flex-col gap-12 mt-8 justify-center w-full max-w-7xl">
    <app-home-section
      title="Séries"
      typeCard="series"
      [resource]="serieData()"
      (clickCard)="handleClickSerie($event)"
      (retry)="loadAll()"
    />
    <app-home-section
      title="Franquias"
      typeCard="franchises"
      [resource]="franchiseData()"
      (clickCard)="handleClickFranchise($event)"
      (retry)="loadAll()"
    />
    <app-home-section
      title="Obras"
      typeCard="works"
      [resource]="workCatalog()"
      (clickCard)="handleClickWork($event)"
      (retry)="loadAll()"
    />
  </div>
</div>

<app-form-button label="open dialog" (handleClick)="createWork()" [fluid]="false" size="large" />
