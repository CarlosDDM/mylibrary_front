<div class="min-h-screen flex items-center justify-center p-4">
  <div
    class="w-full max-w-sm rounded-2xl border border-surface-200 dark:border-surface-800 bg-surface-0 dark:bg-surface-900 shadow-xl p-8"
  >
    <div class="flex flex-col items-center text-center mb-8">
      <div
        class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center mb-4"
      >
        <i class="pi pi-book text-2xl text-primary-contrast"></i>
      </div>
      <h1 class="text-2xl font-semibold">MyLibrary</h1>
      <p class="text-sm text-muted-color mt-1">Entre na sua conta para continuar</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
      <app-form-input
        id="username"
        label="Login"
        formControlName="username"
        [invalid]="isInvalid('username')"
      />
      <app-form-input
        id="password"
        label="Senha"
        formControlName="password"
        type="password"
        [invalid]="isInvalid('password')"
      />
      <app-form-button
        type="submit"
        label="Entrar"
        icon="pi pi-sign-in"
        [fluid]="true"
        [disabled]="submitting"
      />
    </form>
  </div>
</div>
