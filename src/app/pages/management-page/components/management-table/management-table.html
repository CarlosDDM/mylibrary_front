<p-table
  [columns]="cols()"
  [value]="data()"
  [lazy]="true"
  [paginator]="true"
  [rows]="rows()"
  [totalRecords]="total()"
  [loading]="state() === 'loading'"
  (onLazyLoad)="lazyLoad.emit($event)"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Um total de {totalRecords} itens."
  [pt]="{ pcPaginator: { current: { class: '!mr-auto' } } }"
  [scrollable]="true"
>
  <ng-template #caption>
    <div class="flex">
      <p-iconfield iconPosition="left" class="ml-auto">
        <p-inputicon>
          <i class="pi pi-search"></i>
        </p-inputicon>
        <input pInputText type="text" placeholder="Procurar" />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header let-columns>
    <tr>
      @for (col of columns; track col) {
        <th>
          {{ col.header }}
        </th>
      }
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template #body let-rowData let-columns="columns">
    <tr>
      @for (col of columns; track col) {
        @let raw = col.value ? col.value(rowData) : (rowData | resolveField: col.field);
        <td>
          {{ applyPipe(col, raw) }}
        </td>
      }
      <td class="flex gap-2">
        <p-button
          icon="pi pi-pencil"
          (click)="editClick.emit(rowData.id)"
          severity="secondary"
          rounded
        />
        <p-button
          icon="pi pi-trash"
          (click)="deleteClick.emit(rowData.id)"
          severity="danger"
          rounded
        />
      </td>
    </tr>
  </ng-template>
</p-table>
