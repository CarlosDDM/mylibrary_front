<div class="flex flex-col gap-2 py-2">
  @if (label()) {
    <label [attr.for]="id()" class="text-sm font-medium text-zinc-700 dark:text-zinc-100">{{
      label()
    }}</label>
  }
  <div class="flex flex-wrap gap-2" [attr.id]="id()">
    @for (opt of options(); track optVal(opt)) {
      <button type="button" (click)="toggle(optVal(opt))" [class]="chipClass()(optVal(opt))">
        {{ opt[optionLabel()] }}
      </button>
    }
  </div>
</div>
