<div>
  <p-floatlabel variant="on">
    <p-password
      [inputId]="id()"
      [ngModel]="value"
      [invalid]="invalid()"
      [disabled]="disabled"
      [toggleMask]="toggleMask()"
      [feedback]="feedback()"
      [promptLabel]="promptLabel()"
      [weakLabel]="weakLabel()"
      [mediumLabel]="mediumLabel()"
      [strongLabel]="strongLabel()"
      [mediumRegex]="mediumRegex()"
      [strongRegex]="strongRegex()"
      autocomplete="off"
      (input)="onInput($event)"
      (onBlur)="onTouched()"
      fluid
      appendTo="body"
    >
      <ng-template #footer>
        <p-divider />
        <ul class="pl-2 my-0 leading-normal text-sm">
          <li>No minimo uma letra minuscula</li>
          <li>No minimo uma letra maiuscula</li>
          <li>No minimo um número</li>
          <li>No minimo um caracter especial</li>
          <li>Minimo 8 caracteres</li>
        </ul>
      </ng-template>
    </p-password>
    <label [for]="id()">{{ label() }}</label>
  </p-floatlabel>
</div>
