<div>
  <p-floatlabel variant="on">
    <input
      pInputText
      [type]="type()"
      [id]="id()"
      [value]="value"
      [invalid]="invalid()"
      [disabled]="disabled"
      (input)="onInput($event)"
      (blur)="onTouched()"
      autocomplete="off"
      fluid
    />
    <label [for]="id()">{{ label() }}</label>
  </p-floatlabel>
</div>
