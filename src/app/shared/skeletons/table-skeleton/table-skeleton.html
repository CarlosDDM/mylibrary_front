<p-table [columns]="cols()" [value]="rows()">
  <ng-template #header let-columns>
    <tr>
      @for (col of columns; track col) {
        <th>
          {{ col.header }}
        </th>
      }
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template #body let-columns="columns">
    <tr>
      @for (col of columns; track col) {
        <td>
          <p-skeleton height="1.5rem" />
        </td>
      }
      <td>
        <p-skeleton height="1.5rem" />
      </td>
    </tr>
  </ng-template>
</p-table>
